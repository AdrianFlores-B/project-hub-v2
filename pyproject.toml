[project]
name = "project-hub-v2"
version = "0.1.0"
description = "REST API built with FastAPI, using PostgreSQL for relational data (users, projects, memberships, document metadata) and S3/LocalStack for file storage. Features JWT-based authentication and granular, pre-execution RBAC (Owner vs. Participant permissions)."
authors = [
    {name = "AdrianFlores-B", email = "tpg2001@outlook.com"}
]

requires-python = ">=3.12"
dependencies = [
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.1,<0.53.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "boto3 (>=1.43.70,<2.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "email-validator (>=2.3.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "app" }] 
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.1,<0.17.0)",
    "httpx2 (>=2.9.1,<3.0.0)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]