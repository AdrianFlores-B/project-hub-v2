services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: projecthub
      POSTGRES_PASSWORD: projecthub
      POSTGRES_DB: projecthub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projecthub"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:4
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,lambda
      # native docker has no host.docker.internal; give it to lambda containers
      LAMBDA_DOCKER_FLAGS: "--add-host host.docker.internal:host-gateway"
    volumes:
      # sets up the bucket, the lambda and the S3 trigger once localstack is ready
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
      - ./lambdas:/opt/lambdas:ro
      # localstack runs lambdas in containers of their own
      - /var/run/docker.sock:/var/run/docker.sock

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # smtp, the api sends here
      - "8025:8025" # web ui to read the captured mails

  # containerized api, opt-in so it doesn't fight the dev server for the port:
  #   docker compose --profile full up -d
  api:
    build: .
    profiles: ["full"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://projecthub:projecthub@db:5432/projecthub
      S3_ENDPOINT_URL: http://localstack:4566
      SMTP_HOST: mailpit
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata: