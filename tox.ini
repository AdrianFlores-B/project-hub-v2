[tox]
envlist = py312, py313, lint
skip_missing_interpreters = true

[testenv]
description = run the test suite with coverage (needs the compose db running)
dependency_groups = dev
commands = pytest --cov --cov-report=term-missing {posargs}

[testenv:lint]
description = static checks
skip_install = true
dependency_groups = dev
commands =
    ruff check .
    ruff format --check .
